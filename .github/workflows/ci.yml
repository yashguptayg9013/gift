name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: puja
          POSTGRES_PASSWORD: puja_dev_password
          POSTGRES_DB: puja_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U puja" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql://puja:puja_dev_password@localhost:5432/puja_os_test?schema=public
      DATABASE_URL: postgresql://puja:puja_dev_password@localhost:5432/puja_os_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @puja/shared build
      - run: pnpm --filter @puja/api exec prisma generate
      - name: Lint
        run: pnpm -r lint
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Shared unit tests
        run: pnpm --filter @puja/shared test
      - name: API integration tests (real PostgreSQL)
        run: pnpm --filter @puja/api test
      - name: Build API
        run: pnpm --filter @puja/api build
      - name: Build web
        run: pnpm --filter @puja/web build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @puja/shared build
      - run: pnpm --filter @puja/web exec playwright install --with-deps chromium
      - run: pnpm --filter @puja/web build
      - run: pnpm --filter @puja/web test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f docker/api.Dockerfile -t puja-api:ci .
      - run: docker build -f docker/web.Dockerfile -t puja-web:ci .
