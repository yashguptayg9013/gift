# PUJA OS — single-host deployment (see DEPLOYMENT_GUIDE.md).
# Secrets come from .env (copy .env.example). Nothing secret is committed.
name: puja-os

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-puja_os}
      POSTGRES_USER: ${POSTGRES_USER:-puja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-puja} -d ${POSTGRES_DB:-puja_os}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY}; do sleep 2; done;
      mc mb --ignore-existing local/$${S3_BUCKET:-puja-files}; mc anonymous set none local/$${S3_BUCKET:-puja-files}"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-puja-files}

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-puja}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-puja_os}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-puja-files}
      TRUST_PROXY: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args: { API_URL: "http://api:4000" }
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-3000}:3000"

  backup:
    image: postgres:16.6-alpine
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-puja_os}
      PGUSER: ${POSTGRES_USER:-puja}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-23}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do if [ \"$$(date +%H)\" = \"$${BACKUP_HOUR}\" ]; then /usr/local/bin/backup.sh; sleep 3600; fi; sleep 300; done"]

volumes:
  pgdata:
  redisdata:
  miniodata:
